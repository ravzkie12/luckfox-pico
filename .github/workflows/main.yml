name: Build Alpine Image
on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Tashkent


jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Alpine rootfs
        run: sudo ./rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-alpine
          path: output/rootfs-alpine.tar.gz

  build-system:
    strategy:
      matrix:
        device:
          - pico-mini-b
    runs-on: ubuntu-latest
    needs: build-rootfs
    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      
      - name: Download built rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-alpine

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git ssh make gcc gcc-multilib g++-multilib module-assistant expect g++ gawk texinfo libssl-dev bison flex fakeroot cmake unzip gperf autoconf device-tree-compiler libncurses5-dev pkg-config bc python-is-python3 passwd openssl openssh-server openssh-client vim file cpio rsync
      
      - name: Build final sysupgrade.img
        run: ./system.sh -f rootfs-alpine.tar.gz -d ${{ matrix.device }}
      
      - name: Upload finished sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-sysupgrade
          path: output/${{ matrix.device }}-sysupgrade.img

      - name: Upload firmware to release
        if: ${{ env.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        with:
          tag_name: latest
          name: Latest firmware
          body: |
            Automatically built firmware.
            Device: ${{ matrix.device }}
            Commit: ${{ github.sha }}
          prerelease: false
          make_latest: true
          files: |
            output/${{ matrix.device }}-sysupgrade.img